name: Build & Deploy

on:
  push:
    branches: [main]
    paths-ignore:
      - 'docs/**'
      - '**/*.md'
  workflow_dispatch:

# Serialize deploys on main; never cancel an in-flight rollout.
concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: hedginvault/telegram-bot
  DEPLOYMENT: telegram-bot
  NAMESPACE: hedgevault-prod
  MANIFESTS: k8s

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write
    outputs:
      immutable-tag: ${{ steps.tag.outputs.immutable }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set image tags
        id: tag
        run: |
          echo "immutable=${GITHUB_SHA::12}-${{ github.run_number }}" >> "$GITHUB_OUTPUT"
          echo "moving=${{ github.ref_name }}" >> "$GITHUB_OUTPUT"

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build & push image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ steps.tag.outputs.immutable }}
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ steps.tag.outputs.moving }}
          cache-from: type=gha,scope=${{ github.ref_name }}
          cache-to: type=gha,mode=max,scope=${{ github.ref_name }}

  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install deps
        run: yarn install --frozen-lockfile

      - name: Type-check, test, build
        run: |
          yarn typecheck
          yarn test
          yarn build

  # Long-polling Telegram bot: no Service or Ingress.
  deploy:
    needs: [build, quality]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # Add a required-reviewer rule to this GitHub Environment to gate prod rollouts.
    environment: production
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Write kubeconfig
        run: |
          mkdir -p "$HOME/.kube"
          echo "${{ secrets.KUBECONFIG }}" | base64 -d > "$HOME/.kube/config"
          chmod 600 "$HOME/.kube/config"

      - name: Install kubectl
        uses: azure/setup-kubectl@v4
        with:
          version: v1.31.0

      # telegram-bot-secrets is provisioned out of band. Fail before applying anything if it is missing; never create it here.
      - name: Check runtime secret exists
        run: kubectl -n "$NAMESPACE" get secret telegram-bot-secrets -o name

      - name: Apply manifests
        env:
          IMAGE_TAG: ${{ needs.build.outputs.immutable-tag }}
        run: |
          kubectl -n "$NAMESPACE" apply -f "$MANIFESTS/pvc.yaml"
          kubectl -n "$NAMESPACE" apply -f "$MANIFESTS/configmap.yaml"
          sed "s|__IMAGE_TAG__|${IMAGE_TAG}|g" "$MANIFESTS/deployment.yaml" \
            | kubectl -n "$NAMESPACE" apply -f -

      - name: Wait for rollout
        run: |
          kubectl -n "$NAMESPACE" rollout status \
            deployment/"$DEPLOYMENT" --timeout=10m
